services:
  - type: web
    name: techstore
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
    disk:
      name: techstore-data
      mountPath: /app/data
      sizeGB: 1
